name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        # --severity=warning skips info-level style nits (e.g. SC2086 on
        # space-free paths, and the intentional literal $() inside install.sh's
        # sed expression) while still catching real bugs.
        run: shellcheck --severity=warning install.sh bin/trmnl test_suite.sh

  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Parse-check all Lua config
        # loadfile() compiles each chunk without executing it, so this catches
        # genuine syntax errors without needing the plugin runtime (unlike a
        # dofile-based check, which conflates runtime errors with syntax ones).
        run: |
          rc=0
          while IFS= read -r f; do
            if ! TRMNL_CHECK_FILE="$f" nvim --headless -u NONE -i NONE --noplugin -n \
              -c 'lua local f,e=loadfile(os.getenv("TRMNL_CHECK_FILE")); if not f then print(e); vim.cmd("cquit 1") end' \
              -c 'qa!'; then
              rc=1
            fi
          done < <(find config -name '*.lua')
          exit "$rc"
      - name: Check literal mapping modes without executing configuration
        run: python3 tests/check_keymaps.py config/nvim

  manager-transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check actual manager recovery in private HOME and XDG fixtures
        run: python3 tests/check_transactions.py "$RUNNER_TEMP/trmnl-transactions"
